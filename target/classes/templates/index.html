
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Outfit Calculator</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<h1>Smart Outfit Calculator</h1>

<h2>Find Your Perfect Outfit</h2>

<p>
    Get smart outfit recommendations based on your
    occasion, weather and temperature.
</p>

<form action="/recommend" method="post">

    <label for="occasion">Select Occasion</label>

    <select id="occasion" name="occasion" required>
        <option value="">Choose Occasion</option>
        <option value="University">University</option>
        <option value="Office">Office</option>
        <option value="Casual">Casual</option>
        <option value="Party">Party</option>
        <option value="Wedding">Wedding</option>
        <option value="Viva/Interview">Viva/Interview</option>
    </select>

    <label for="weather">Select Weather</label>

    <select id="weather" name="weather" required>
        <option value="">Choose Weather</option>
        <option value="Sunny">Sunny</option>
        <option value="Rainy">Rainy</option>
        <option value="Cloudy">Cloudy</option>
    </select>

    <label for="temperature">Temperature (°C)</label>

    <input type="number"
           id="temperature"
           name="temperature"
           placeholder="Enter temperature"
           required>

    <button type="submit">
        Get Outfit Recommendations
    </button>

</form>

</body>
</html>
